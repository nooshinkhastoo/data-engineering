services:

  cassandra1:
    image: cassandra:5.0
    container_name: cassandra1
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      CASSANDRA_CLUSTER_NAME: MyCluster
      CASSANDRA_DC: DC1
      CASSANDRA_RACK: RACK1
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra1

  cassandra2:
    image: cassandra:5.0
    container_name: cassandra2
    environment:
      MAX_HEAP_SIZE: 512M
      CASSANDRA_CLUSTER_NAME: MyCluster
      CASSANDRA_DC: DC1
      CASSANDRA_RACK: RACK1
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra2

  cassandra3:
    image: cassandra:5.0
    container_name: cassandra3
    environment:
      MAX_HEAP_SIZE: 512M
      CASSANDRA_CLUSTER_NAME: MyCluster
      CASSANDRA_DC: DC1
      CASSANDRA_RACK: RACK1
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra3

  app:
    build: ./app
    container_name: cassandra-app