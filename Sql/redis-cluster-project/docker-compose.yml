services:

  redis-1:
    image: redis:7
    container_name: redis-1
    ports:
      - "7001:6379"
    volumes:
      - ./redis-node/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-2:
    image: redis:7
    container_name: redis-2
    ports:
      - "7002:6379"
    volumes:
      - ./redis-node/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-3:
    image: redis:7
    container_name: redis-3
    ports:
      - "7003:6379"
    volumes:
      - ./redis-node/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  cluster-init:
    image: redis:7
    container_name: redis-cluster-init
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    volumes:
      - ./cluster-init/init.sh:/init.sh
    command: sh /init.sh