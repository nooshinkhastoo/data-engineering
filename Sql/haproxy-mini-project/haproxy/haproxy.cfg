global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:8080
    default_backend backend_servers

backend backend_servers
    balance roundrobin

    server backend-1 backend-1:3000 check
    server backend-2 backend-2:3000 check
